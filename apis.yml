description: Digital Surgery (originally Touch Surgery / Kinosis) is a London-based surgical
  artificial intelligence company backed by Balderton Capital and acquired by Medtronic in 2020,
  where it now operates as part of Medtronic's Covidien surgical business. It builds the Touch
  Surgery ecosystem of surgical simulation and training tools and Touch Surgery Enterprise, an
  AI-powered platform for recording, analyzing, and reviewing surgical video in the operating
  room. The company does not publish a public developer program or API; digitalsurgery.com now
  redirects to Medtronic's Digital Surgery product page. This profile remains a network stub
  awaiting a real developer surface.
